[mod-setting-name]
more-barrels-include-plasma=Include plasma
more-barrels-fluid-blacklist=Fluid blacklist
more-barrels-overwrite-opt-out=Overwrite opt-outs
more-barrels-opt-out-whitelist=Opt-out whitelist

[mod-setting-description]
more-barrels-include-plasma=Add recipes for barrelling and unbarrelling plasma, even though plasma cannot be piped into assemblers.
more-barrels-fluid-blacklist=Comma-separated list of fluid names that should not get barrel recipes.
more-barrels-overwrite-opt-out=Force barrel recipes for fluids that other mods have explicitly opted out of barrelling.
more-barrels-opt-out-whitelist=Comma-separated list of fluid names whose opt-out should be overridden, even when 'Overwrite opt-outs' is off. Defaults to the fluids the base game itself opted out of barrelling (steam, molten metals, etc.) since adding barrels for those is this mod's purpose.
